<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>LAMBLE report images</title>
<style>
:root{--bg:#0e0f12;--panel:#16171b;--ink:#f3f2ee;--ink2:#b9b8b0;--ink3:#85847d;--grid:#26272c;--line:#34353b;
--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#14a014;--s7:#9085e9;--s8:#e66767;--other:#6d6c67;--seq-lo:#1b2638;--seq-hi:#5aa2f2;}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg)}
body{font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink)}
.slide{display:none;width:1600px;height:900px;padding:56px 72px 40px;position:relative;background:var(--bg);overflow:hidden}
.slide.on{display:block}
.kick{font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:600}
h1{font-size:46px;white-space:nowrap;line-height:1.08;margin:10px 0 8px;letter-spacing:-.02em;max-width:1360px}
.sub{font-size:23px;color:var(--ink2);margin:0;max-width:1300px}
.chart{position:absolute;left:72px;right:72px;top:210px;bottom:84px;display:flex;flex-direction:column}
.chart svg{width:100%;flex:1;min-height:0;display:block;overflow:visible}
.foot{position:absolute;left:72px;right:72px;bottom:28px;font-size:16px;color:var(--ink3);display:flex;justify-content:space-between}
svg text{font-family:inherit;fill:var(--ink2);font-size:18px}
svg .t3 text,svg text.t3{fill:var(--ink3)}
svg text.big{fill:var(--ink);font-weight:650}
.legend{display:flex;gap:26px;font-size:19px;color:var(--ink2);margin-top:14px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:8px;vertical-align:-1px}
.tiles{position:absolute;left:72px;right:72px;top:300px;display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:30px 36px;height:230px}
.tile .v{font-size:84px;font-weight:700;letter-spacing:-.03em;line-height:1}
.tile .l{font-size:25px;color:var(--ink);margin-top:14px;font-weight:600}
.tile .d{font-size:19px;color:var(--ink2);margin-top:6px}
</style></head><body>
<script>const D=__DATA__;</script>
<div id="root"></div>
<script>
const MS=864e5, $=(s,r=document)=>r.querySelector(s);
const money=(v,d=1)=>v>=1e9?'$'+(v/1e9).toFixed(2)+'B':v>=1e6?'$'+(v/1e6).toFixed(d)+'M':v>=1e3?'$'+Math.round(v/1e3)+'K':'$'+Math.round(v);
const num=v=>Math.round(v).toLocaleString('en-US');
const pct=v=>(v>=0?'+':'−')+Math.abs(v*100).toFixed(0)+'%';
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dl=ms=>{const d=new Date(ms);return MON[d.getUTCMonth()]+' '+d.getUTCDate()};
const tOf=s=>Date.parse(s+'T00:00:00Z');
const days=D.days,last=days[days.length-1],F=D.fees;
const FOOT='<span>Fees: DefiLlama via Frames · Narratives and launch counts: Codex via Frames · LAMBLE daily refresh</span>';
const slides=[];
function slide(kick,h1,sub,body,foot){slides.push(`<section class="slide"><div class="kick">${kick}</div><h1>${h1}</h1><p class="sub">${sub}</p>${body}<div class="foot">${FOOT}<span>${foot||''}</span></div></section>`)}
function nice(max,n=4){const r=max/n,p=10**Math.floor(Math.log10(r)),f=r/p,s=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p,o=[];for(let v=0;v<=max+s*.999;v+=s)o.push(v);return o}
const CW=1456,CH=600;

// ---------- derived facts
const ft=F.times.map(t=>t*1000), ftot=F.subtotal;
const pk=ftot.indexOf(Math.max(...ftot)), n=ftot.length;
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
const vk=Object.keys(F.venues);
const w1=i=>i<7, w2=i=>i>=n-7;
const venueStat=vk.map(k=>{const a=F.venues[k].map(v=>v||0);return{k,name:F.names[k],a1:avg(a.slice(0,7)),a2:avg(a.slice(n-7)),tot:a.reduce((x,y)=>x+y,0),arr:a}}).sort((a,b)=>b.tot-a.tot);
const fromPeak=ftot[n-1]/ftot[pk]-1, wk1=avg(ftot.slice(0,7)), wk2=avg(ftot.slice(n-7));
// leaders
const lead=days.map(d=>Object.entries(d.n).sort((a,b)=>b[1].v24-a[1].v24)[0][0]);
let changes=0;for(let i=1;i<days.length;i++)if(lead[i]!==lead[i-1])changes++;
const firstSeen={},lastSeen={},peak={};
days.forEach(d=>Object.entries(d.n).forEach(([id,x])=>{firstSeen[id]??=d.date;lastSeen[id]=d.date;if(!peak[id]||x.v24>peak[id].v)peak[id]={v:x.v24,d:d.date}}));
const ids=Object.keys(D.titles).sort((a,b)=>firstSeen[a]<firstSeen[b]?-1:firstSeen[a]>firstSeen[b]?1:0);
const curIds=Object.keys(last.n).sort((a,b)=>last.n[b].v24-last.n[a].v24);
const retired=ids.filter(i=>!curIds.includes(i));
const span=i=>(tOf(lastSeen[i])-tOf(firstSeen[i]))/MS+1;
const med=a=>{const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const medLife=med(retired.map(span));
const tot24=days.map(d=>Object.values(d.n).reduce((a,x)=>a+x.v24,0));
const tpk=tot24.indexOf(Math.max(...tot24));
const cr=days.map(d=>d.created), crMin=Math.min(...cr.slice(1)), crMinI=cr.indexOf(crMin);
const START=dl(ft[0]), END=dl(ft[n-1]);

// ---------- 1 cover
slide('State of the trenches','Four weeks of launchpad fees, narratives and launches','Daily snapshots, '+days[0].date+' to '+last.date+'. Fees are settled UTC days; narratives are a curated tracked set, not the whole market.',
`<div class="tiles">
<div class="tile"><div class="v" style="color:var(--s2)">${pct(fromPeak)}</div><div class="l">Daily launchpad fees vs the ${dl(ft[pk])} peak</div><div class="d">${money(ftot[pk],2)} → ${money(ftot[n-1],2)} per day, 14 non-overlapping venues</div></div>
<div class="tile"><div class="v" style="color:var(--s1)">${ids.length}</div><div class="l">Narratives tracked in ${(tOf(last.date)-tOf(days[0].date))/MS+1} days</div><div class="d">${retired.length} already retired · median lifespan ${medLife} days</div></div>
<div class="tile"><div class="v" style="color:var(--s3)">${changes}</div><div class="l">Changes of the #1 narrative in ${days.length-1} snapshots</div><div class="d">by 24h pool volume, across the tracked set</div></div>
<div class="tile"><div class="v" style="color:var(--s4)">${pct(crMin/cr[1]-1)}</div><div class="l">Indexed token creations, ${dl(tOf(days[1].date))} → ${dl(tOf(days[crMinI].date))}</div><div class="d">${num(cr[1])} → ${num(crMin)} created per 24h (beta indexed counts)</div></div>
</div>`,'');

// ---------- 2 fees hero (stacked area)
(function(){
  const top=venueStat.slice(0,5), rest=venueStat.slice(5);
  const ser=[{name:'Other venues',color:'var(--other)',a:ft.map((_,i)=>rest.reduce((s,v)=>s+v.arr[i],0))}].concat(top.slice().reverse().map((v,i)=>({name:v.name,color:`var(--s${5-i})`,a:v.arr})));
  // stack bottom->top: other first... reorder so largest at bottom
  const order=[...top.map((v,i)=>({name:v.name,color:`var(--s${i+1})`,a:v.arr})),{name:'Other venues',color:'var(--other)',a:ser[0].a}];
  const M={l:84,r:130,t:20,b:40}, ymax=nice(Math.max(...ftot)*1.05).slice(-1)[0], ticks=nice(Math.max(...ftot)*1.05);
  const X=i=>M.l+i/(n-1)*(CW-M.l-M.r), Y=v=>CH-M.b-v/ymax*(CH-M.t-M.b);
  const cum=order.map(()=>new Array(n).fill(0)),base=new Array(n).fill(0);
  order.forEach((s,k)=>{for(let i=0;i<n;i++){cum[k][i]=base[i]+s.a[i];base[i]=cum[k][i]}});
  let g='';ticks.forEach(t=>g+=`<line x1="${M.l}" x2="${CW-M.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--grid)"/><text class="t3" x="${M.l-12}" y="${Y(t)+6}" text-anchor="end">${money(t,0)}</text>`);
  for(let i=0;i<n;i+=4)g+=`<text class="t3" x="${X(i)}" y="${CH-10}" text-anchor="middle">${dl(ft[i])}</text>`;
  order.forEach((s,k)=>{const lo=k?cum[k-1]:new Array(n).fill(0);const up=cum[k].map((v,i)=>`${X(i)} ${Y(v)}`),dn=lo.map((v,i)=>`${X(i)} ${Y(v)}`).reverse();g+=`<path d="M${up.join('L')}L${dn.join('L')}Z" fill="${s.color}" stroke="var(--bg)" stroke-width="2"/>`});
  g+=`<circle cx="${X(pk)}" cy="${Y(ftot[pk])}" r="7" fill="var(--ink)" stroke="var(--bg)" stroke-width="3"/><text class="big" x="${X(pk)}" y="${Y(ftot[pk])-22}" text-anchor="middle" style="font-size:22px">${dl(ft[pk])} peak ${money(ftot[pk],2)}</text>`;
  g+=`<circle cx="${X(n-1)}" cy="${Y(ftot[n-1])}" r="7" fill="var(--ink)" stroke="var(--bg)" stroke-width="3"/><text class="big" x="${X(n-1)+16}" y="${Y(ftot[n-1])-8}" style="font-size:22px">${money(ftot[n-1],2)}</text><text x="${X(n-1)+16}" y="${Y(ftot[n-1])+18}">${END}</text>`;
  const lg=order.map(s=>`<span><i style="background:${s.color}"></i>${s.name}</span>`).join('');
  slide('Fees over time',`Launchpad fees are down ${Math.abs(fromPeak*100).toFixed(0)}% from the ${dl(ft[pk])} peak`,`14 non-overlapping venues, per settled UTC day. Weekly average: ${money(wk1,2)} → ${money(wk2,2)} per day (${pct(wk2/wk1-1)}).`,
  `<div class="chart" style="top:215px"><div class="legend" style="margin:0 0 6px 84px">${lg}</div><svg viewBox="0 0 ${CW} ${CH}" preserveAspectRatio="xMidYMid meet">${g}</svg></div>`,'');
})();

// ---------- 3 dumbbell by venue
(function(){
  const top=venueStat.slice(0,8), rest=venueStat.slice(8);
  const rows=top.map(v=>({name:v.name,a1:v.a1,a2:v.a2})).concat([{name:`Other ${rest.length} venues`,a1:rest.reduce((s,v)=>s+v.a1,0),a2:rest.reduce((s,v)=>s+v.a2,0)}]);
  const M={l:260,r:300,t:30,b:50}, xmax=nice(Math.max(...rows.map(r=>Math.max(r.a1,r.a2)))*1.05,4);
  const xm=xmax[xmax.length-1], rh=(CH-M.t-M.b)/rows.length, X=v=>M.l+v/xm*(CW-M.l-M.r);
  let g='';xmax.forEach(t=>g+=`<line x1="${X(t)}" x2="${X(t)}" y1="${M.t}" y2="${CH-M.b}" stroke="var(--grid)"/><text class="t3" x="${X(t)}" y="${CH-14}" text-anchor="middle">${money(t,1)}</text>`);
  rows.forEach((r,i)=>{const y=M.t+i*rh+rh/2,ch=r.a2/r.a1-1,col=ch>=0?'var(--s3)':'var(--s2)';
    g+=`<text class="big" x="${M.l-24}" y="${y+7}" text-anchor="end" style="font-size:22px">${r.name}</text><line x1="${X(r.a1)}" x2="${X(r.a2)}" y1="${y}" y2="${y}" stroke="${col}" stroke-width="5" stroke-linecap="round" opacity=".55"/><circle cx="${X(r.a1)}" cy="${y}" r="10" fill="var(--bg)" stroke="var(--ink2)" stroke-width="4"/><circle cx="${X(r.a2)}" cy="${y}" r="11" fill="${col}" stroke="var(--bg)" stroke-width="3"/><text x="${CW-M.r+30}" y="${y-4}" style="font-size:22px;fill:var(--ink)">${money(r.a1,2)} → ${money(r.a2,2)}</text><text x="${CW-M.r+30}" y="${y+22}" style="font-size:20px;font-weight:700;fill:${col}">${pct(ch)}</text>`});
  const best=venueStat.slice().sort((a,b)=>(b.a2-b.a1)-(a.a2-a.a1))[0], worst=venueStat.slice().sort((a,b)=>(a.a2-a.a1)-(b.a2-b.a1))[0];
  slide('Where the fees went',`${best.name} ${pct(best.a2/best.a1-1)}, ${worst.name} ${pct(worst.a2/worst.a1-1)}: fees moved unevenly`,`Average daily fees, first week (${dl(ft[0])} – ${dl(ft[6])}) vs last week (${dl(ft[n-7])} – ${dl(ft[n-1])}), per venue ($ per day).`,
  `<div class="chart" style="top:190px"><svg viewBox="0 0 ${CW} ${CH}">${g}</svg></div>`,'Hollow dot: first week · filled dot: last week');
})();

// ---------- 4 heatmap
(function(){
  const t0=tOf(days[0].date),t1=tOf(last.date),cols=[];for(let t=t0;t<=t1;t+=MS)cols.push(t);
  const byT={};days.forEach(d=>byT[tOf(d.date)]=d);
  const L=380,cw=(CW-L)/cols.length,T=36,rh=(CH-T-4)/ids.length;
  let vmin=1e18,vmax=0;days.forEach(d=>Object.values(d.n).forEach(x=>{if(x.v24>0){vmin=Math.min(vmin,x.v24);vmax=Math.max(vmax,x.v24)}}));
  const tt=v=>(Math.log10(v)-Math.log10(vmin))/(Math.log10(vmax)-Math.log10(vmin));
  let g='';cols.forEach((t,i)=>g+=`<text class="${byT[t]?'':'t3'}" x="${L+i*cw+cw/2}" y="22" text-anchor="middle" style="font-size:16px;${byT[t]?'':'opacity:.5'}">${dl(t)}</text>`);
  ids.forEach((id,r)=>{const y=T+r*rh,cur=curIds.includes(id);
    g+=`<text x="${L-14}" y="${y+rh/2+6}" text-anchor="end" style="font-size:19px;fill:${cur?'var(--ink)':'var(--ink3)'};${cur?'font-weight:650':''}">${D.titles[id]}</text>`;
    cols.forEach((t,i)=>{const d=byT[t],x=d&&d.n[id],cx=L+i*cw;
      if(!x){g+=`<rect x="${cx+1.5}" y="${y+1.5}" width="${cw-3}" height="${rh-3}" rx="5" fill="none" stroke="var(--grid)"/>`;return}
      const f=Math.max(0,Math.min(1,tt(Math.max(x.v24,vmin)))),isL=lead[days.indexOf(d)]===id;
      g+=`<rect x="${cx+1.5}" y="${y+1.5}" width="${cw-3}" height="${rh-3}" rx="5" style="fill:color-mix(in oklab,var(--seq-hi) ${Math.round(8+f*92)}%,var(--seq-lo))" ${isL?'stroke="var(--ink)" stroke-width="3"':''}/><text x="${cx+cw/2}" y="${y+rh/2+6}" text-anchor="middle" style="font-size:17px;fill:${f>.5?'#fff':'var(--ink)'};font-weight:${isL?700:500}">${(x.v24/1e6).toFixed(x.v24>=1e7?0:1)}</text>`});});
  slide('How fast narratives change',`The #1 narrative changed ${changes} times in ${days.length-1} snapshots`,`24h pool volume per tracked narrative, $M. White outline: that day's leader. ${ids.length} tracked, ${curIds.length} still active.`,
  `<div class="chart" style="top:200px"><svg viewBox="0 0 ${CW} ${CH}">${g}</svg></div>`,'Empty cell: not tracked that day · Sep 29 – Oct 1: no snapshots');
})();

// ---------- 5 lifespans
(function(){
  const t0=tOf(days[0].date),t1=tOf(last.date),nd=(t1-t0)/MS+1,L=380,R=240,T=30,rh=(CH-T-40)/ids.length,X=t=>L+(t-t0)/MS/nd*(CW-L-R),cwid=(CW-L-R)/nd;
  let g='';
  g+=`<rect x="${X(tOf('2026-09-29'))}" y="${T-8}" width="${cwid*3}" height="${CH-T-30}" fill="var(--panel)"/><text class="t3" x="${X(tOf('2026-09-29'))+cwid*1.5}" y="${CH-44}" text-anchor="middle" style="font-size:16px">no snapshots</text>`;
  for(let t=t0;t<=t1;t+=MS*3)g+=`<line x1="${X(t)}" x2="${X(t)}" y1="${T-8}" y2="${CH-30}" stroke="var(--grid)"/><text class="t3" x="${X(t)+cwid/2}" y="${CH-6}" text-anchor="middle">${dl(t)}</text>`;
  ids.forEach((id,r)=>{const y=T+r*rh+rh/2,cur=curIds.includes(id),a=tOf(firstSeen[id]),b=tOf(lastSeen[id]),col=cur?'var(--s3)':'var(--other)';
    g+=`<text x="${L-14}" y="${y+6}" text-anchor="end" style="font-size:19px;fill:${cur?'var(--ink)':'var(--ink3)'};${cur?'font-weight:650':''}">${D.titles[id]}</text><rect x="${X(a)+1}" y="${y-11}" width="${X(b)-X(a)+cwid-2}" height="22" rx="11" fill="${col}"/><text x="${X(b)+cwid+12}" y="${y+6}" style="font-size:18px;fill:var(--ink2)">${span(id)}d · peak ${money(peak[id].v,0)}</text>`});
  slide('Narratives live fast',`Median lifespan of a retired narrative: ${medLife} days`,`First to last snapshot in which each narrative was tracked. ${retired.length} of ${ids.length} have already been retired; green bars are still active.`,
  `<div class="chart" style="top:200px"><svg viewBox="0 0 ${CW} ${CH}">${g}</svg></div>`,'Lifespans are lower bounds: Sep 29 – Oct 1 had no snapshots');
})();

// ---------- 6 total tracked volume
(function(){
  const M={l:84,r:20,t:30,b:44},ymax=nice(Math.max(...tot24)*1.02),ym=ymax[ymax.length-1],t0=tOf(days[0].date),t1=tOf(last.date),nd=(t1-t0)/MS+1,cw=(CW-M.l-M.r)/nd,X=t=>M.l+(t-t0)/MS*cw,Y=v=>CH-M.b-v/ym*(CH-M.t-M.b);
  let g='';ymax.forEach(t=>g+=`<line x1="${M.l}" x2="${CW-M.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--grid)"/><text class="t3" x="${M.l-12}" y="${Y(t)+6}" text-anchor="end">${money(t,0)}</text>`);
  const colorOf=Object.fromEntries(curIds.map((id,i)=>[id,`var(--s${i+1})`]));
  days.forEach((d,di)=>{let acc=0;const x=X(tOf(d.date))+cw*.15,w=cw*.7;
    const parts=[['other',Object.entries(d.n).filter(([id])=>!curIds.includes(id)).reduce((s,[,v])=>s+v.v24,0),'var(--other)']].concat(curIds.slice().reverse().map(id=>[id,(d.n[id]||{v24:0}).v24,colorOf[id]]));
    parts.forEach(([id,v,c])=>{if(v<=0)return;const y1=Y(acc+v),y2=Y(acc);g+=`<rect x="${x}" y="${y1}" width="${w}" height="${Math.max(0,y2-y1-2)}" rx="3" fill="${c}"/>`;acc+=v});
    if(di%2===0||di===days.length-1)g+=`<text class="t3" x="${x+w/2}" y="${CH-14}" text-anchor="middle" style="font-size:16px">${dl(tOf(d.date))}</text>`;});
  const px=X(tOf(days[tpk].date))+cw/2,lx=X(t1)+cw/2;
  g+=`<text class="big" x="${px}" y="${Y(tot24[tpk])-12}" text-anchor="middle" style="font-size:24px">${money(tot24[tpk],1)}</text><text class="big" x="${lx}" y="${Y(tot24[days.length-1])-12}" text-anchor="end" style="font-size:24px">${money(tot24[days.length-1],1)}</text>`;
  const lg=curIds.map((id,i)=>`<span><i style="background:var(--s${i+1})"></i>${D.titles[id]}</span>`).join('')+'<span><i style="background:var(--other)"></i>Earlier narratives</span>';
  slide('Attention cooled',`Tracked narrative volume: ${money(tot24[tpk],0)} (${dl(tOf(days[tpk].date))}) → ${money(tot24[tot24.length-1],0)} (${dl(tOf(last.date))})`,`24h pool volume summed over the narratives tracked each day. The set changes daily: read it as the tracked set's attention, not the market.`,
  `<div class="chart" style="top:215px"><div class="legend" style="margin:0 0 4px 84px;font-size:17px;flex-wrap:wrap;gap:6px 20px;max-width:1300px">${lg}</div><svg viewBox="0 0 ${CW} ${CH-40}" style="overflow:visible">${g}</svg></div>`,'');
})();

// ---------- 7 activity
(function(){
  const panel=(arr,col,title,note,flip)=>{const w=700,h=470,M={l:76,r:20,t:30,b:40},ymax=nice(Math.max(...arr)*1.08,4),ym=ymax[ymax.length-1],t0=tOf(days[0].date),t1=tOf(last.date),X=i=>M.l+(tOf(days[i].date)-t0)/(t1-t0)*(w-M.l-M.r),Y=v=>h-M.b-v/ym*(h-M.t-M.b);
    let g='';ymax.forEach(t=>g+=`<line x1="${M.l}" x2="${w-M.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--grid)"/><text class="t3" x="${M.l-10}" y="${Y(t)+6}" text-anchor="end" style="font-size:16px">${t>=1000?(t/1000)+'K':t}</text>`);
    let d='';arr.forEach((v,i)=>{d+=(i&&tOf(days[i].date)-tOf(days[i-1].date)<=MS*1.5?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)});
    g+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="4" stroke-linejoin="round"/>`;arr.forEach((v,i)=>g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="5" fill="${col}" stroke="var(--bg)" stroke-width="2"/>`);
    [0,Math.floor(days.length/2),days.length-1].forEach(i=>g+=`<text class="t3" x="${X(i)}" y="${h-10}" text-anchor="middle" style="font-size:16px">${dl(tOf(days[i].date))}</text>`);
    const mi=arr.indexOf(Math.min(...arr.slice(1))),li=arr.length-1;
    g+=`<text class="big" x="${X(mi)}" y="${Y(arr[mi])+34}" text-anchor="middle" style="font-size:20px">low ${num(arr[mi])}</text><text class="big" x="${X(li)}" y="${flip?Y(arr[li])+36:Y(arr[li])-14}" text-anchor="end" style="font-size:20px">${num(arr[li])}</text>`;
    return `<div><div style="font-size:26px;font-weight:650;margin-bottom:2px">${title}</div><div style="font-size:18px;color:var(--ink3);margin-bottom:6px">${note}</div><svg viewBox="0 0 ${w} ${h}" style="width:100%;overflow:visible">${g}</svg></div>`};
  const cmp=days.map(d=>d.completed);
  slide('Launch activity',`Token creations: ${pct(crMin/cr[1]-1)} by ${dl(tOf(days[crMinI].date))}, then a bounce`,`Provider-indexed counts per 24h. Beta data: coverage and cutoffs are not independently verified.`,
  `<div class="chart" style="top:235px;display:grid;grid-template-columns:1fr 1fr;gap:40px">${panel(cr,'var(--s1)','Tokens created, 24h','14 venues with creation records')}${panel(cmp,'var(--s7)','Completions, 24h','11 venues with completion records',true)}</div>`,'');
})();

$('#root').innerHTML=slides.join('');
const k=(location.hash||'#1').slice(1);document.querySelectorAll('.slide')[k-1].classList.add('on');
</script></body></html>
